services:
  kafka:
    extends:
      file: docker-compose.kafka.yaml
      service: kafka

  example-receive:
    build:
      context: ./example-receive
    container_name: example-receive
    # Waits for the broker to serve metadata, not merely to have started.
    # `depends_on` without a condition only orders container start, which left
    # the sender producing before the broker was ready. It happened to work
    # because a fresh consumer group replays from the beginning of the log --
    # a safety net, not ordering.
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092

  example-send:
    build:
      context: ./example-send
    container_name: example-send
    depends_on:
      kafka:
        condition: service_healthy
      example-receive:
        condition: service_started
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092

  # Opt-in: the full producer/consumer API surface (headers, batches, custom
  # partitioning, dead letters, retries), not a matched send/receive pair.
  # Run with `docker compose --profile advanced up --build`.
  example-advanced-receive:
    profiles: ["advanced"]
    build:
      context: ./example-advanced-receive
    container_name: example-advanced-receive
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092

  example-advanced-send:
    profiles: ["advanced"]
    build:
      context: ./example-advanced-send
    container_name: example-advanced-send
    depends_on:
      kafka:
        condition: service_healthy
      example-advanced-receive:
        condition: service_started
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092

volumes:
  kafka_data:
