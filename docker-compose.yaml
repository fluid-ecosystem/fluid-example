services:
  kafka:
    extends:
      file: docker-compose.kafka.yaml
      service: kafka

  example-receive:
    build:
      context: ./example-receive
    container_name: example-receive
    # Waits for the broker to serve metadata, not merely to have started.
    # `depends_on` without a condition only orders container start, which left
    # the sender producing before the broker was ready. It happened to work
    # because a fresh consumer group replays from the beginning of the log --
    # a safety net, not ordering.
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092

  example-send:
    build:
      context: ./example-send
    container_name: example-send
    depends_on:
      kafka:
        condition: service_healthy
      example-receive:
        condition: service_started
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092

  # Opt-in: the full producer/consumer API surface (headers, batches, custom
  # partitioning, dead letters, retries), not a matched send/receive pair.
  # Run with `docker compose --profile advanced up --build`.
  example-advanced-receive:
    profiles: ["advanced"]
    build:
      context: ./example-advanced-receive
    container_name: example-advanced-receive
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092

  example-advanced-send:
    profiles: ["advanced"]
    build:
      context: ./example-advanced-send
    container_name: example-advanced-send
    depends_on:
      kafka:
        condition: service_healthy
      example-advanced-receive:
        condition: service_started
    environment:
      - BOOTSTRAP_SERVERS=kafka:9092

  # Shared by every Postgres-backed example (JDBC, Hibernate); each brings
  # its own tables, so one instance is enough.
  postgres:
    extends:
      file: docker-compose.postgres.yaml
      service: postgres
    profiles: ["postgres-jdbc", "postgres-hibernate"]

  # Raw JDBC, no ORM. Run with `docker compose --profile postgres-jdbc up --build`.
  example-postgres-jdbc:
    profiles: ["postgres-jdbc"]
    build:
      context: ./example-postgres-jdbc
    container_name: example-postgres-jdbc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - POSTGRES_URL=jdbc:postgresql://postgres:5432/fluid
      - POSTGRES_USER=fluid
      - POSTGRES_PASSWORD=fluid

  # Embedded, no separate database container or network hop.
  # Run with `docker compose --profile h2 up --build`.
  example-h2:
    profiles: ["h2"]
    build:
      context: ./example-h2
    container_name: example-h2

volumes:
  kafka_data:
  postgres_data:
